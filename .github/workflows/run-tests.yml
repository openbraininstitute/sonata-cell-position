name: Run tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel superseded runs on PRs, but let every run on main complete
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Run tests (linux/arm64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Check requirements
        run: make check-deps
      - name: Install requirements
        run: make install
      - name: Run linters
        run: make lint
      - name: Run tests
        run: make test
